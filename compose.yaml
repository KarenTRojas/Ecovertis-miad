# Ecovertis MIAD — integración FastAPI + Dash (entrega final)
# Requiere Docker Compose V2. Uso académico; servicios HTTP sin TLS.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ecovertis-api:final
    restart: unless-stopped
    init: true
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 20s
      timeout: 7s
      retries: 5
      start_period: 30s

  tablero:
    build:
      context: .
      dockerfile: Dockerfile.dash
    image: ecovertis-dash:final
    restart: unless-stopped
    init: true
    ports:
      - "8050:8050"
    environment:
      ECO_API_URL: "http://api:8001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/', timeout=5)"]
      interval: 20s
      timeout: 7s
      retries: 5
      start_period: 30s
